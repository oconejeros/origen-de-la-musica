function sheet(x,y,c){R(x,y,18,13,'#f0e8d0');R(x,y+12,18,1,'#c8b898');for(let k=0;k<3;k++)R(x+2,y+3+k*3,14,1,'#8a7a6a');for(let k=0;k<4;k++)R(x+3+k*4,y+2+(k*5)%7,2,2,c||'#1a1a1a');}

function sOpera(st){

  for(let k=0;k<6;k++){const x=30+k*26;for(let i=0;i<14;i++)R(x-i*.6,62-i,1+i*1.2,1,'#2a1a2a');}
  R(0,66,W,20,'#5a3a22');R(0,66,W,1,'#7a5030');
  for(let x=24;x<170;x+=12)candle(x,62,st+x);
  for(let s of [0,1]){const cx=s?W-26:0;R(cx,0,26,86,'#8a1a22');for(let k=0;k<26;k+=4)R(cx+k,0,1,86,'#6a1018');}

const SUBJ=[[294,1],[440,1],[349,1],[294,1],[277,1],[294,1],[330,1],[349,2],[392,1],[349,1],[330,1],[294,2],[0,2]];
function seqNote(seq,b){let acc=0;for(let i=0;i<seq.length;i++){if(b>=acc&&b<acc+seq[i][1])return [seq[i][0],seq[i][1],b===acc];acc+=seq[i][1];}return null;}
const PIPES=[...Array(25)].map((_,i)=>{const d=Math.abs(i-12);return [22+i*6,14+d*2.6+(i%2)*3];});
function sOrgan(st){
  R(0,0,W,H,'#1e1a24');R(12,6,168,72,'#5a3a22');R(12,6,168,2,'#c8a040');R(12,76,168,2,'#c8a040');
  const beat=.26,b=Math.floor((st-1)/beat),on=st>1&&st<13.3,v1=on?seqNote(SUBJ,b):null,v2=on&&b>=16?seqNote(SUBJ.map(([f,d])=>[f?f*1.5/2:0,d]),b-16):null,v3=on&&b>=32?seqNote(SUBJ.map(([f,d])=>[f?f/2:0,d]),b-32):null;
  const active=[v1,v2,v3].filter(v=>v&&v[0]).map(v=>v[0]);
